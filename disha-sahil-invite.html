<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disha &amp; Sahil · Wedding Invitation</title>
<meta name="description" content="You're invited to celebrate the wedding of Disha &amp; Sahil">
<meta property="og:title" content="Disha &amp; Sahil · Wedding Invitation">
<meta property="og:description" content="With the blessings of our parents and elders, we joyfully invite you.">
<meta name="theme-color" content="#5a0d1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Great+Vibes&amp;family=Tiro+Devanagari+Hindi&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#fbf5ea; --paper:#f5ead6; --maroon:#7a1027; --deep:#4a0a18; --gold:#b8892f; --gold-l:#e6c97f;
  --ink:#3b2420; --muted:#7b6257; --marigold:#f2a516;
  --serif:'Cormorant Garamond',Georgia,serif; --caps:'Cinzel',Georgia,serif; --script:'Great Vibes',cursive; --deva:'Tiro Devanagari Hindi',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:#2a0710;color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.5;overflow-x:hidden}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;cursor:pointer}
.page{max-width:480px;margin:0 auto;background:var(--ivory);position:relative;overflow:hidden;min-height:100vh;box-shadow:0 0 60px rgba(0,0,0,.5)}
@media (min-width:600px){body{background:radial-gradient(circle at 50% 20%,#5a0d1c,#22050c 70%)}}

/* ---------- Intro doors ---------- */
#intro{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;perspective:1400px;background:#1c040a}
#intro .doors{position:relative;width:100%;max-width:480px;height:100%;display:flex}
#intro .door{flex:1;height:100%;position:relative;background:
  radial-gradient(circle at 50% 50%,rgba(230,201,127,.10),transparent 60%),
  linear-gradient(160deg,#7a1027,#4a0a18);
  transition:transform 1.6s cubic-bezier(.6,.05,.25,1);transform-style:preserve-3d;box-shadow:inset 0 0 0 10px #3a0712, inset 0 0 0 12px var(--gold), inset 0 0 0 22px #5c0d20, inset 0 0 0 23px rgba(230,201,127,.6)}
#intro .door.l{transform-origin:left center}
#intro .door.r{transform-origin:right center}
#intro.open .door.l{transform:rotateY(-105deg)}
#intro.open .door.r{transform:rotateY(105deg)}
#intro.open{background:transparent;pointer-events:none;transition:background .8s}
#intro.gone{display:none}
#intro .door svg{position:absolute;inset:36px 26px;width:calc(100% - 52px);height:calc(100% - 72px)}
#intro .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f3dc9c,#c99a3c 55%,#8a6420);border:none;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 6px rgba(255,255,255,.18),inset 0 0 0 9px rgba(120,80,20,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4a0a18;transition:opacity .5s,transform .6s}
#intro .seal .mono{font-family:var(--script);font-size:46px;line-height:1}
#intro .seal small{font-family:var(--caps);font-size:10px;letter-spacing:.25em;margin-top:4px}
#intro.open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.3)}
#intro .hint{position:absolute;bottom:9vh;left:0;right:0;text-align:center;color:var(--gold-l);font-family:var(--caps);font-size:12px;letter-spacing:.3em;z-index:3;animation:pulse 2s infinite}
#intro .welcome{position:absolute;top:10vh;left:0;right:0;text-align:center;color:var(--gold-l);z-index:3;padding:0 30px}
#intro .welcome .s{font-family:var(--script);font-size:34px;color:#f6e3b0}
#intro .welcome .c{font-family:var(--caps);font-size:11px;letter-spacing:.3em;opacity:.85}
#intro.open .hint,#intro.open .welcome{opacity:0;transition:opacity .4s}
.seal-pulse{position:absolute;left:50%;top:50%;width:150px;height:150px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid rgba(230,201,127,.6);animation:ring 2.2s infinite;z-index:2}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(1);opacity:.8}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
@keyframes pulse{50%{opacity:.4}}

/* ---------- Hero ---------- */
.hero{position:relative;text-align:center;padding:34px 22px 20px;background:
  radial-gradient(ellipse at 50% 0%,#fff8ea 0%,var(--ivory) 60%);}
.hero .om{font-family:var(--deva);color:var(--maroon);font-size:20px;letter-spacing:.02em}
.ganesh{width:58px;height:58px;margin:6px auto 4px}
.bless{font-style:italic;color:var(--muted);font-size:17px;margin-top:6px}
.invite-line{font-family:var(--caps);font-size:11.5px;letter-spacing:.22em;color:var(--maroon);margin:14px auto 0;max-width:300px;line-height:1.8}
.couple-art{position:relative;margin:10px -22px 0}
.couple-art svg{width:100%;height:auto;display:block}
.names{margin-top:-6px}
.name-block{padding:6px 0}
.name-block .nm{font-family:var(--caps);font-weight:700;font-size:40px;letter-spacing:.18em;color:var(--maroon);line-height:1.1;text-indent:.18em}
.name-block .par{font-size:16px;color:var(--ink);margin-top:6px}
.name-block .gpar{font-size:14.5px;color:var(--muted);font-style:italic}
.amp{font-family:var(--script);font-size:54px;color:var(--gold);line-height:1;margin:4px 0}
.tag{display:inline-block;margin-top:18px;font-family:var(--script);font-size:34px;color:var(--maroon);position:relative;padding:0 26px}
.tag:before,.tag:after{content:"";position:absolute;top:55%;width:18px;height:1px;background:var(--gold)}
.tag:before{left:0}.tag:after{right:0}
.divider{display:block;width:180px;margin:18px auto;color:var(--gold)}
.scroll-cue{margin:18px auto 6px;font-family:var(--caps);font-size:10px;letter-spacing:.3em;color:var(--muted)}
.scroll-cue span{display:block;width:1px;height:34px;background:linear-gradient(var(--gold),transparent);margin:8px auto 0;animation:drop 1.8s infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* petals */
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.petal{position:absolute;top:-20px;width:12px;height:9px;border-radius:60% 0 60% 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}

/* ---------- Countdown ---------- */
.countdown{background:var(--deep);color:var(--gold-l);text-align:center;padding:30px 18px;position:relative}
.countdown h3{font-family:var(--caps);font-size:12px;letter-spacing:.3em;font-weight:500}
.cd-grid{display:flex;justify-content:center;gap:10px;margin-top:14px}
.cd-grid div{width:68px;padding:10px 0;border:1px solid rgba(230,201,127,.4);border-radius:8px}
.cd-grid b{display:block;font-family:var(--caps);font-size:26px;color:#fff3d6;font-weight:500}
.cd-grid small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.cd-date{margin-top:12px;font-style:italic;font-size:16px;color:#f2dfae}

/* ---------- Section heads ---------- */
.sec{padding:46px 20px;position:relative}
.sec-head{text-align:center;margin-bottom:26px}
.sec-head .k{font-family:var(--caps);font-size:11px;letter-spacing:.32em;color:var(--gold)}
.sec-head h2{font-family:var(--script);font-weight:400;font-size:44px;color:var(--maroon);line-height:1.1;margin-top:4px}

/* ---------- Event cards ---------- */
.events{background:var(--paper)}
.ev{position:relative;border-radius:170px 170px 18px 18px;padding:56px 24px 30px;margin:0 auto 30px;text-align:center;overflow:hidden;isolation:isolate}
.ev .day{font-family:var(--caps);font-size:12px;letter-spacing:.35em}
.ev .daynum{font-family:var(--caps);font-size:56px;line-height:1;margin:2px 0 6px;font-weight:500}
.ev h3{font-family:var(--script);font-weight:400;font-size:42px;line-height:1.05}
.ev .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0 4px}
.ev .chips span{font-family:var(--caps);font-size:10.5px;letter-spacing:.14em;padding:5px 10px;border-radius:30px}
.ev .desc{font-size:17.5px;margin:14px auto 0;max-width:330px}
.ev .meta{margin:20px auto 0;display:grid;gap:12px;max-width:320px}
.ev .meta .row{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;border-radius:12px}
.ev .meta svg{flex:none;width:22px;height:22px}
.ev .meta .lbl{font-family:var(--caps);font-size:9.5px;letter-spacing:.22em;opacity:.75}
.ev .meta .val{font-size:17px;font-weight:600;line-height:1.25}
.ev .theme-note{margin:18px auto 0;max-width:320px;padding:12px 14px;border-radius:14px}
.ev .theme-note .t{font-family:var(--caps);font-size:10px;letter-spacing:.25em;opacity:.8}
.ev .theme-note .v{font-family:var(--script);font-size:32px;line-height:1.2}
.swatches{display:flex;justify-content:center;gap:6px;margin-top:6px}
.swatches i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.btn-loc{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:13px 24px;border-radius:40px;font-family:var(--caps);font-size:12px;letter-spacing:.2em;text-decoration:none;font-weight:700;transition:transform .2s}
.btn-loc:active{transform:scale(.97)}
.ev-deco{position:absolute;inset:0;z-index:-1;pointer-events:none}

/* theme: glam */
.ev.glam{background:radial-gradient(circle at 50% 0%,#7a1a4a 0%,#3a0b2a 45%,#1c0716 100%);color:#f6e6c8;box-shadow:0 18px 40px rgba(58,11,42,.35)}
.ev.glam .daynum,.ev.glam h3{color:#f3d58f;text-shadow:0 0 18px rgba(243,213,143,.35)}
.ev.glam .chips span{border:1px solid rgba(243,213,143,.5);color:#f3d58f}
.ev.glam .meta .row{background:rgba(255,255,255,.07);border:1px solid rgba(243,213,143,.25)}
.ev.glam .meta svg{color:#f3d58f}
.ev.glam .btn-loc{background:linear-gradient(135deg,#f3d58f,#c99a3c);color:#2a0820;box-shadow:0 6px 20px rgba(243,213,143,.3)}
.ev.glam .theme-note{background:rgba(255,255,255,.07)}
/* theme: green */
.ev.green{background:linear-gradient(180deg,#e7efd9 0%,#cfe0b8 55%,#b5cf98 100%);color:#1d3b26;box-shadow:0 18px 40px rgba(47,90,50,.25)}
.ev.green .daynum{color:#2f6b3f}
.ev.green h3{color:#1f5e3b}
.ev.green .chips span{background:#1f5e3b;color:#eaf3dc}
.ev.green .meta .row{background:rgba(255,255,255,.55);border:1px solid rgba(31,94,59,.18)}
.ev.green .meta svg{color:#2f6b3f}
.ev.green .btn-loc{background:#1f5e3b;color:#f1f7e6;box-shadow:0 6px 18px rgba(31,94,59,.3)}
.ev.green .theme-note{background:rgba(255,255,255,.6);border:1px dashed rgba(31,94,59,.35)}
.ev.green .theme-note .v{color:#1f5e3b}
/* theme: royal */
.ev.royal{background:radial-gradient(circle at 50% 10%,#8e1a2f 0%,#5a0d1c 50%,#33060f 100%);color:#fbecc9;box-shadow:0 22px 50px rgba(51,6,15,.45);padding-top:70px}
.ev.royal:before{content:"";position:absolute;inset:10px;border-radius:162px 162px 12px 12px;border:1.5px solid rgba(230,201,127,.7);z-index:-1}
.ev.royal:after{content:"";position:absolute;inset:16px;border-radius:156px 156px 8px 8px;border:1px solid rgba(230,201,127,.35);z-index:-1}
.ev.royal .daynum,.ev.royal h3{color:#f0cf7e}
.ev.royal h3{font-size:50px}
.ev.royal .chips span{background:rgba(240,207,126,.15);color:#f0cf7e;border:1px solid rgba(240,207,126,.4)}
.ev.royal .meta .row{background:rgba(0,0,0,.18);border:1px solid rgba(240,207,126,.3)}
.ev.royal .meta svg{color:#f0cf7e}
.ev.royal .btn-loc{background:linear-gradient(135deg,#f6dc96,#c49335);color:#4a0a18;box-shadow:0 8px 22px rgba(240,207,126,.3)}
.ev.royal .theme-note{background:rgba(0,0,0,.18)}
.ev.royal .lead{font-family:var(--caps);font-size:13px;letter-spacing:.25em;margin-top:10px;color:#fff1cf}
/* theme: classic (for added events) */
.ev.classic{background:#fff;color:var(--ink);border:1px solid #ead9b8;box-shadow:0 14px 30px rgba(122,16,39,.12)}
.ev.classic .daynum,.ev.classic h3{color:var(--maroon)}
.ev.classic .chips span{background:var(--paper);color:var(--maroon)}
.ev.classic .meta .row{background:var(--ivory);border:1px solid #ead9b8}
.ev.classic .meta svg{color:var(--gold)}
.ev.classic .btn-loc{background:var(--maroon);color:#fff}

/* ---------- Gallery ---------- */
.gallery{background:var(--ivory)}
.polaroids{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 6px 18px;scrollbar-width:none}
.polaroids::-webkit-scrollbar{display:none}
.polaroid{flex:0 0 82%;scroll-snap-align:center;background:#fff;padding:10px 10px 14px;border-radius:4px;box-shadow:0 10px 26px rgba(74,10,24,.18);transform:rotate(-1.5deg)}
.polaroid:nth-child(even){transform:rotate(1.5deg)}
.polaroid img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:2px}
.polaroid p{font-family:var(--script);font-size:26px;text-align:center;color:var(--maroon);margin-top:6px;min-height:10px}
.polaroids.single{justify-content:center}
.gal-note{text-align:center;font-style:italic;color:var(--muted);max-width:340px;margin:8px auto 0;font-size:17px}

/* ---------- RSVP ---------- */
.rsvp{background:linear-gradient(180deg,var(--paper),#efdcc0);text-align:center}
.rsvp .lead{font-size:20px;font-style:italic;color:var(--ink)}
.rsvp .sub{font-family:var(--caps);font-size:11.5px;letter-spacing:.25em;color:var(--maroon);margin-top:8px}
.rsvp-card{background:#fffaf1;border:1px solid #e7d3ad;border-radius:20px;padding:22px 18px;margin:22px auto 0;max-width:400px;text-align:left;box-shadow:0 14px 30px rgba(122,16,39,.10)}
.field{margin-bottom:16px}
.field label,.field .lbl{display:block;font-family:var(--caps);font-size:10.5px;letter-spacing:.2em;color:var(--maroon);margin-bottom:6px}
.field input[type=text],.field input[type=tel],.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #dcc59a;background:#fff;font:inherit;font-size:17px;color:var(--ink);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(122,16,39,.12)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid #dcc59a;background:#fff;font-size:22px;color:var(--maroon)}
.stepper output{font-family:var(--caps);font-size:24px;min-width:30px;text-align:center}
.days-pick{display:grid;gap:8px}
.days-pick label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e3cfa6;border-radius:12px;background:#fff;font-family:var(--serif);font-size:16.5px;letter-spacing:0;color:var(--ink);margin:0;cursor:pointer}
.days-pick input{width:20px;height:20px;accent-color:var(--maroon)}
.days-pick b{font-family:var(--caps);font-size:10.5px;letter-spacing:.15em;color:var(--maroon);font-weight:700}
.btn-yes{display:flex;width:100%;justify-content:center;align-items:center;gap:10px;padding:16px 20px;border:none;border-radius:40px;background:linear-gradient(135deg,#8e1a2f,#5a0d1c);color:#fff3d6;font-family:var(--caps);font-size:13px;letter-spacing:.2em;font-weight:700;box-shadow:0 10px 24px rgba(90,13,28,.35);text-decoration:none}
.btn-yes svg{width:20px;height:20px}
.btn-no{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);text-decoration:underline;font-size:15.5px}
.form-err{color:#b3261e;font-size:15px;margin-top:-6px;margin-bottom:10px;display:none}
.wa-note{font-size:13.5px;color:var(--muted);text-align:center;margin-top:10px}

/* ---------- Footer ---------- */
.foot{background:var(--deep);color:#f2dfae;text-align:center;padding:44px 22px 90px;position:relative}
.foot .s{font-family:var(--script);font-size:40px;color:#f6dc96}
.foot p{font-style:italic;opacity:.9;max-width:320px;margin:8px auto 0}
.foot .fam{font-family:var(--caps);font-size:11px;letter-spacing:.25em;margin-top:18px;opacity:.85}
.foot .btn-yes{max-width:320px;margin:24px auto 0;background:linear-gradient(135deg,#f6dc96,#c49335);color:#4a0a18}
.foot .hash{margin-top:20px;font-family:var(--caps);letter-spacing:.2em;font-size:12px;color:var(--gold-l)}

/* ---------- Floating music ---------- */
#musicBtn{position:fixed;right:max(14px,calc(50% - 240px + 14px));bottom:18px;z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid rgba(230,201,127,.7);background:rgba(74,10,24,.88);color:#f6dc96;display:none;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35);backdrop-filter:blur(4px)}
#musicBtn.show{display:flex}
#musicBtn svg{width:22px;height:22px}
#musicBtn.playing .bars i{animation:eq .9s infinite ease-in-out}
.bars{display:flex;gap:2px;align-items:flex-end;height:16px}
.bars i{width:3px;height:6px;background:currentColor;border-radius:2px}
.bars i:nth-child(2){animation-delay:.2s!important}.bars i:nth-child(3){animation-delay:.4s!important}.bars i:nth-child(4){animation-delay:.1s!important}
@keyframes eq{50%{height:16px}}
#musicBtn:not(.playing) .bars i{height:3px}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.petal{display:none}}

/* swinging toran */
.swing{transform-origin:50% 0;animation:swing 4s ease-in-out infinite}
@keyframes swing{50%{transform:rotate(2deg)}}
.twinkle{animation:tw 2.4s infinite}
@keyframes tw{50%{opacity:.25}}

/* ---------- Admin ---------- */
#editFab{position:fixed;left:max(14px,calc(50% - 240px + 14px));bottom:18px;z-index:55;padding:12px 16px;border-radius:30px;border:none;background:#1f1a17;color:#fff;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.35);display:flex;gap:8px;align-items:center}
#admin{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:60;background:#fbfaf8;color:#1f1a17;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.4;box-shadow:-12px 0 40px rgba(0,0,0,.35);transform:translateX(105%);transition:transform .35s ease;display:flex;flex-direction:column}
#admin.open{transform:none}
#admin header{padding:14px 16px;border-bottom:1px solid #e8e3dc;display:flex;align-items:center;gap:10px}
#admin header h4{font-size:16px;flex:1}
#admin header button{border:none;background:#efebe5;border-radius:8px;padding:6px 10px}
#admin .tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid #e8e3dc;overflow-x:auto;scrollbar-width:none}
#admin .tabs button{border:none;background:none;padding:8px 10px;border-radius:8px;white-space:nowrap;color:#6b625a;font-weight:600;font-size:13px}
#admin .tabs button.on{background:#7a1027;color:#fff}
#admin .body{flex:1;overflow-y:auto;padding:14px 16px 30px}
#admin .grp{background:#fff;border:1px solid #ebe5dd;border-radius:12px;padding:12px;margin-bottom:12px}
#admin .grp h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7a1027;margin-bottom:8px;display:flex;align-items:center;gap:8px}
#admin .grp h5 .sp{flex:1}
#admin label.f{display:block;margin-bottom:10px}
#admin label.f span{display:block;font-size:12px;color:#6b625a;margin-bottom:4px;font-weight:600}
#admin input[type=text],#admin input[type=tel],#admin input[type=url],#admin input[type=datetime-local],#admin textarea,#admin select{width:100%;padding:9px 10px;border:1px solid #d9d2c8;border-radius:8px;font:inherit;background:#fff;color:#1f1a17}
#admin textarea{min-height:64px;resize:vertical}
#admin input[type=range]{width:100%}
#admin input[type=color]{width:44px;height:32px;border:1px solid #d9d2c8;border-radius:6px;padding:2px;background:#fff}
#admin .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#admin .colors{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#admin .colors label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#4b443e}
#admin .btn{border:none;border-radius:8px;padding:9px 12px;background:#efebe5;color:#1f1a17;font-weight:600;font-size:13px}
#admin .btn.pri{background:#7a1027;color:#fff}
#admin .btn.dark{background:#1f1a17;color:#fff}

function toranArc(){
  // marigold strings along an arch
  var out='', i, t, x, y, cx=300, cy=250, rx=250, ry=215;
  for(i=0;i<=46;i++){
    t=Math.PI*(i/46); x=cx-rx*Math.cos(t); y=cy-ry*Math.sin(t);
    var col = i%3===0?'#e8590c':(i%3===1?'#f59f00':'#fcc419');
    out+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9.5" fill="'+col+'"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="rgba(255,255,255,.25)"/>';
    if(i%4===2) out+='<path d="M'+x.toFixed(1)+' '+(y+8).toFixed(1)+'q-6 10 0 18q6-8 0-18z" fill="#2f7d32"/>';
  }
  // side hangings
  [50,550].forEach(function(sx){
    for(var j=0;j<12;j++){ var c=j%2?'#f59f00':'#e8590c'; out+='<circle cx="'+sx+'" cy="'+(262+j*17)+'" r="8.5" fill="'+c+'"/>'; }
  });
  return out;
}

function headImg(id,h){

function shade(hex,p){
  hex=String(hex||'#000').replace('#',''); if(hex.length===3) hex=hex.split('').map(function(c){return c+c}).join('');
  var n=parseInt(hex,16), r=n>>16&255, g=n>>8&255, b=n&255, f=p/100;
  var a=function(c){return Math.round(Math.max(0,Math.min(255,f>0?c+(255-c)*f:c*(1+f))))};
  return '#'+((1<<24)+(a(r)<<16)+(a(g)<<8)+a(b)).toString(16).slice(1);
}

    (r.askPhone?'<div class="field"><label for="rPhone">Contact number'+(r.phoneRequired?'':' (optional)')+'</label><input type="tel" id="rPhone" autocomplete="tel" placeholder="+91 …"></div>':'')+
    '<div class="field"><label for="rMsg">Blessings / message (optional)</label><textarea id="rMsg" rows="2" placeholder="A note for the couple"></textarea></div>'+
    '<div class="form-err" id="rErr"></div>'+
    '<button type="submit" class="btn-yes">'+IC.wa+' '+esc(r.yesText)+'</button>'+
    (r.showDecline?'<button type="button" class="btn-no" id="rNo">'+esc(r.noText)+'</button>':'')+
    '<p class="wa-note">'+esc(r.note)+'</p>'+
   '</form>'+
  '</section>'+
  '<footer class="foot"><div class="s rv">'+esc(t.footerScript)+'</div><p class="rv">'+nl(t.footerNote)+'</p>'+
   '<a href="#rsvp" class="btn-yes rv">'+esc(r.yesText)+' '+IC.arrow+'</a>'+
   (t.hashtag?'<div class="hash">'+esc(t.hashtag)+'</div>':'')+
   '<div class="fam">'+nl(t.families)+'</div>'+
  '</footer>';
  $('#app').innerHTML = html;
  bindRSVP(); startCountdown(); reveal(); petals();
}

/* ================= RSVP → WhatsApp ================= */
var guestCount=1;
function bindRSVP(){
  var f=$('#rsvpForm'); if(!f) return;
  guestCount = Math.max(1, guestCount);
  $('#rCount').textContent=guestCount;
  f.querySelectorAll('[data-st]').forEach(function(b){b.onclick=function(){guestCount=Math.min(20,Math.max(1,guestCount+(+b.dataset.st)));$('#rCount').textContent=guestCount}});
  f.onsubmit=function(e){e.preventDefault();send(true)};
  var no=$('#rNo'); if(no) no.onclick=function(){send(false)};
}
function send(yes){
  var r=CFG.rsvp, name=$('#rName').value.trim(), err=$('#rErr');
  var phoneEl=$('#rPhone'), phone=phoneEl?phoneEl.value.trim():'';
  var days=[].slice.call(document.querySelectorAll('input[name=days]:checked')).map(function(i){return i.value});
  var msg=$('#rMsg').value.trim();
  var problem = !name ? 'Please enter your name.' : (yes && !days.length ? 'Please pick at least one day.' : (r.askPhone && r.phoneRequired && !phone ? 'Please add your contact number.' : ''));
  if(problem){err.textContent=problem;err.style.display='block';return}
  err.style.display='none';
  var num=String(r.whatsapp||'').replace(/\D/g,'');
  if(!num){err.textContent='RSVP number not set yet (add it in Customize → RSVP).';err.style.display='block';return}
  var tpl = yes ? r.yesTemplate : r.noTemplate;
  var text = tpl.replace(/\{name\}/g,name).replace(/\{guests\}/g,String(guestCount))
    .replace(/\{days\}/g, days.length? days.join(', ') : '—')
    .replace(/\{phone\}/g, phone||'—').replace(/\{message\}/g, msg||'—');
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(text),'_blank');
}

/* ================= Countdown ================= */
var cdTimer;
function startCountdown(){
  clearInterval(cdTimer);
  var el=$('#cd'); if(!el) return;
  var target=new Date(CFG.countdown.date).getTime(); if(isNaN(target)) return;
  var tick=function(){
    var d=Math.max(0,target-Date.now()), s=Math.floor(d/1000);
    var v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
    el.querySelectorAll('b').forEach(function(b,i){b.textContent=String(v[i]).padStart(2,'0')});
  };
  tick(); cdTimer=setInterval(tick,1000);
}

/* ================= Reveal + petals ================= */
function reveal(){
  var els=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
  var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.12});
  els.forEach(function(e){io.observe(e)});
}
function petals(){
  var p=$('#petals'); if(!p) return; var cols=['#f59f00','#e8590c','#fcc419','#e64980','#f8c8d0'];
  for(var i=0;i<16;i++){var d=document.createElement('i');d.className='petal';d.style.left=(Math.random()*100)+'%';d.style.background=cols[i%cols.length];d.style.animationDuration=(9+Math.random()*9)+'s';d.style.animationDelay=(-Math.random()*15)+'s';d.style.setProperty('--dx',(Math.random()*120-60)+'px');p.appendChild(d)}
}

/* ================= Intro doors ================= */
function doorArt(){
  return '<svg viewBox="0 0 100 300" preserveAspectRatio="none" fill="none" stroke="#e6c97f" stroke-opacity=".55" stroke-width=".6">'+
   '<path d="M10 290V60q40-55 80 0v230z"/><path d="M16 284V64q34-46 68 0v220z" stroke-opacity=".3"/>'+
   '<circle cx="50" cy="150" r="22"/><circle cx="50" cy="150" r="14" stroke-dasharray="1.5 2"/>'+
   Array.apply(null,{length:12}).map(function(_,i){var a=i*Math.PI/6;return '<path d="M'+(50+Math.cos(a)*14).toFixed(1)+' '+(150+Math.sin(a)*14).toFixed(1)+'Q'+(50+Math.cos(a+.26)*24).toFixed(1)+' '+(150+Math.sin(a+.26)*24).toFixed(1)+' '+(50+Math.cos(a)*30).toFixed(1)+' '+(150+Math.sin(a)*30).toFixed(1)+'"/>'}).join('')+
   '<rect x="24" y="210" width="52" height="60" rx="3"/><rect x="24" y="90" width="52" height="24" rx="12"/></svg>';
}
function buildIntro(){
  var t=CFG.text, i=$('#intro');
  i.innerHTML='<div class="welcome"><div class="c">'+esc(t.introKicker)+'</div><div class="s">'+esc(t.introLine)+'</div></div>'+
   '<div class="doors"><div class="door l">'+doorArt()+'</div><div class="door r">'+doorArt()+'</div></div>'+
   '<div class="seal-pulse"></div><button class="seal" id="openBtn" aria-label="Open invitation"><span class="mono">'+esc(t.monogram)+'</span><small>TAP TO OPEN</small></button>'+
   '<div class="hint">'+esc(t.introHint)+'</div>';
  var open=function(){
    i.classList.add('open'); document.body.classList.remove('locked');
    Music.play();
    setTimeout(function(){i.classList.add('gone')},1700);
  };
  $('#openBtn').onclick=open;
}

/* ================= Music ================= */
var Music=(function(){
  var audio=$('#bgm'), btn=$('#musicBtn'), playing=false, synth=null;
  function src(){return CFG.music.mode==='file'||CFG.music.mode==='url'?(CFG.music.src||''):''}
  function load(){
    stop();
    var s=src();
    if(s){ audio.src=s; audio.volume=+CFG.music.volume||0.6; }
    else { audio.removeAttribute('src'); }
    btn.classList.toggle('show', CFG.music.mode!=='off');
  }
  function play(){
    if(CFG.music.mode==='off') return;
    btn.classList.add('show');
    if(src()){
      try{ if(CFG.music.startAt && audio.currentTime<1) audio.currentTime=+CFG.music.startAt; }catch(e){}
      var p=audio.play(); if(p&&p.then) p.then(function(){set(true)}).catch(function(){set(false)}); else set(true);
    } else { synth=synth||Synth(); synth.start(+CFG.music.volume||0.6); set(true); }
  }
  function stop(){ try{audio.pause()}catch(e){} if(synth) synth.stop(); set(false); }
  function set(v){playing=v;btn.classList.toggle('playing',v)}
  btn.onclick=function(){playing?stop():play()};
  audio.addEventListener('timeupdate',function(){ var e=+CFG.music.endAt; if(e && audio.currentTime>=e){ audio.currentTime=+CFG.music.startAt||0; } });
  return {load:load,play:play,stop:stop,isPlaying:function(){return playing}};
})();
/* Built-in gentle melody (generated live — no copyrighted audio) */
function Synth(){
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return {start:function(){},stop:function(){}};
  var ctx, master, timer, step=0;
  // Raag Yaman-flavoured phrase (Sa Re Ga Ma# Pa Dha Ni) in D
  var base=293.66, R={S:0,r:2,g:4,m:6,P:7,d:9,n:11,S2:12,r2:14,g2:16};
  var tune=['g','r','S','n_','r','g','-','m','g','r','g','-','P','m','g','r','S','-','-','-',
            'g','m','P','d','P','-','m','g','m','P','g','r','S','-','-','-'];
  function freq(n){ if(n==='n_') return base*Math.pow(2,-1/12); return base*Math.pow(2,R[n]/12); }
  function bell(f,t,dur,vol){
    var o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o2.type='triangle'; o.frequency.value=f; o2.frequency.value=f*2.01;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    var g2=ctx.createGain(); g2.gain.value=0.18; o2.connect(g2); g2.connect(g);
    o.connect(g); g.connect(master); o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  }
  function drone(){
    [base/2, base/2*1.5, base/4].forEach(function(f,i){
      var o=ctx.createOscillator(), g=ctx.createGain(), l=ctx.createOscillator(), lg=ctx.createGain();
      o.type='sawtooth'; o.frequency.value=f; var flt=ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=700;
      g.gain.value=0.018; l.frequency.value=0.15+i*0.07; lg.gain.value=0.01; l.connect(lg); lg.connect(g.gain);
      o.connect(flt); flt.connect(g); g.connect(master); o.start(); l.start();
    });
  }
  function sched(){
    var now=ctx.currentTime;
    while(nextT < now+0.6){
      var n=tune[step%tune.length];
      if(n!=='-') bell(freq(n), nextT, 1.6, 0.16);
      if(step%4===0) bell(base/2, nextT, 2.2, 0.05);
      nextT+=0.42; step++;
    }
  }
  var nextT=0;
  return {
    start:function(vol){
      if(!ctx){ ctx=new AC(); master=ctx.createGain(); var rev=ctx.createDelay(); rev.delayTime.value=0.28; var fb=ctx.createGain(); fb.gain.value=0.3; master.connect(rev); rev.connect(fb); fb.connect(rev); rev.connect(ctx.destination); master.connect(ctx.destination); drone(); }
      master.gain.value=vol*0.9; if(ctx.state==='suspended') ctx.resume();
      nextT=ctx.currentTime+0.1; clearInterval(timer); timer=setInterval(sched,200);
    },
    stop:function(){ clearInterval(timer); if(ctx) ctx.suspend(); }
  };
}

/* ================= BOOT ================= */
window.__INVITE__ = {CFG:function(){return CFG}, setCFG:function(c){CFG=c}, render:render, buildIntro:buildIntro, Music:Music, DEFAULTS:DEFAULTS, coupleSVG:coupleSVG, esc:esc, GUEST:GUEST};
render(); buildIntro(); Music.load();
if(location.hash==='#skip'){ $('#intro').classList.add('gone'); document.body.classList.remove('locked'); }
})();
</script>
